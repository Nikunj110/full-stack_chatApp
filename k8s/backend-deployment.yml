apiVersion: apps/v1
kind: Deployment

metadata:
  name: backend-deployment
  namespace: chat-app

spec:
  replicas: 1

  selector:
    matchLabels:
      app: backend

  template:
    metadata:
      name: backend-pod
      labels:
        app: backend

    spec:
      containers:
        - name: chatapp-backend
          image: nikunj07/chatapp-frontend:latest

          ports:
            - containerPort: 5001

          env:
            - name: NODE_ENV
              value: production